# Publica a página (index.html, notebooks/ e assets/) no GitHub Pages a cada push na branch main.
# Em Settings → Pages, escolha "Source: GitHub Actions".
name: Publicar página

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Monta o site
        run: |
          mkdir -p _site
          cp -r index.html assets notebooks _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
